<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compte — SuperSnap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Karla:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="card">
      <div id="already-logged" style="display:none">
        <p>Vous êtes déjà connecté(e). <a href="index.html">Retour au défi</a></p>
      </div>

      <div id="forms">
        <div class="tabs" style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1.2rem;">
          <button id="tab-login" class="ghost">Se connecter</button>
          <button id="tab-signup" class="ghost">Créer un compte</button>
        </div>

        <form id="login-form">
          <h2>Se connecter</h2>
          <label for="login-identifier">Email ou pseudo</label>
          <input id="login-identifier" type="text" autocomplete="username" required />
          <label for="login-password">Mot de passe</label>
          <input id="login-password" type="password" required />
          <p class="error" id="login-error"></p>
          <button type="submit">Se connecter</button>
        </form>

        <form id="signup-form" style="display:none">
          <h2>Créer un compte</h2>
          <label for="signup-username">Pseudo</label>
          <input id="signup-username" required />
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" required />
          <label for="signup-password">Mot de passe (8 caractères min.)</label>
          <input id="signup-password" type="password" minlength="8" required />
          <p class="error" id="signup-error"></p>
          <button type="submit">Créer mon compte</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="js/pages/compte.js"></script>
</body>
</html>
